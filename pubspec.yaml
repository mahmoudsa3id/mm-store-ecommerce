name: mm_store
description: MM Store production-ready guest checkout ecommerce app.
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: ^3.12.2

dependencies:
  cached_network_image: ^4.0.2
  cupertino_icons: ^1.0.8
  dartz: ^0.10.1
  equatable: ^3.0.0
  firebase_core: ^4.15.0
  firebase_messaging: ^16.7.0
  flutter:
    sdk: flutter
  flutter_bloc: ^9.1.1
  flutter_colorpicker: ^1.1.0
  flutter_launcher_icons: ^0.14.4
  flutter_local_notifications: ^22.3.1
  flutter_svg: ^2.3.0
  font_awesome_flutter: ^11.0.0
  get_it: ^9.3.0
  go_router: ^18.0.1
  image: ^4.10.1
  image_picker: ^1.2.3
  image_web_picker: ^0.0.2
  lottie: ^3.6.1
  shared_preferences: ^2.5.5
  supabase_flutter: ^2.17.2
  url_launcher: ^6.3.2
  uuid: ^4.6.0

dev_dependencies:
  flutter_lints: ^6.0.0
  flutter_test:
    sdk: flutter

flutter:
  uses-material-design: true
  assets:
    - assets/svgs/
    - assets/lottie/
  fonts:
    - family: Cairo
      fonts:
        - asset: assets/fonts/Cairo-Regular.ttf
          weight: 400
        - asset: assets/fonts/Cairo-Medium.ttf
          weight: 500
        - asset: assets/fonts/Cairo-SemiBold.ttf
          weight: 600
        - asset: assets/fonts/Cairo-Bold.ttf
          weight: 700
        - asset: assets/fonts/Cairo-ExtraBold.ttf
          weight: 800
        - asset: assets/fonts/Cairo-Black.ttf
          weight: 900
flutter_launcher_icons:
  android: true
  ios: false
  image_path: "assets/images/MM_Store_Logo.png"
  min_sdk_android: 21

  adaptive_icon_background: "#000000"
  adaptive_icon_foreground: "assets/images/MM_Store_Logo.png"
  web:
    generate: true
    image_path: "assets/images/MM_Store_Logo.png"
    background_color: "#000000"
    theme_color: "#000000"